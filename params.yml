# Example parameters file for GHFC WGS Alignment Pipeline
# Copy this file and modify the paths according to your setup

# Pipeline steps control - ALL REQUIRED STEPS MUST BE LISTED
steps: [
    "alignment",
    "deepvariant_sample",
    "deepvariant_family",
    "annotation",
    "snvs_cohort",
    "wisecondorx",
    "wombat",
    # "ancestry",
  ] # Available steps: alignment, deepvariant_sample, deepvariant_family, annotation, snvs_cohort, wisecondorx, wombat, extractor, ancestry

# Input/Output paths
data: "/pasteur/helix/projects/ghfc_wgs/WGS/test-GRCh38/"
scratch: "/pasteur/appa/scratch/fcliquet"

# Cohort name for merged files
cohort_name: "test_cohort"

# Pedigree file (optional - defaults to {data}/pedigree.tsv)
pedigree: "/pasteur/helix/projects/ghfc_wgs/WGS/test-GRCh38/pedigree.tsv"

# Reference genomes
ref: "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/chr/GRCh38.fasta"
ref_name: "GRCh38_GIABv3"
oldref: "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/chr/hs38DH.fa"
wisecondorx_reference: "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/WisecondorX/reference_wisecondorX_hg38_{binsize}.npz"
wisecondorx_binsize: 5000
wisecondorx_predict_args: "--zscore 5 --minrefbins 50 --resegment-all --fix-zero-bins"

# File patterns (adjust according to your naming convention)
fastq_pattern: ""
cram4realignment_pattern: "*.cram"

# Tool paths (when not using containers)
bwa_mem2: "bwa-mem2"
samblaster: "samblaster"
sambamba: "sambamba"
samtools: "samtools"
bazam: "/pasteur/helix/projects/ghfc_wgs/tools/bazam-1.0.1/bazam.jar"

# GLnexus configuration
glnexus_config: "DeepVariant_unfiltered"

# DeepVariant configuration
# WARNING: Update DeepVariant process settings accordingly to the number of threads
deepvariant_threads: 96 # Number of parallel tasks for DeepVariant make_examples

# gnomAD frequency annotation configuration
gnomad_file: "/pasteur/helix/projects/ghfc_wgs/refs/gnomad_v4.1_allChroms.bcf" # Path to gnomAD annotation file
gnomad_filter_field: "AF" # gnomAD field to filter on (e.g., AF, AF_popmax)
gnomad_filter_threshold: "0.01" # Frequency threshold for filtering (e.g., 0.01 for 1%)

# VEP annotation configuration
vep_config: "/pasteur/helix/projects/ghfc_wgs/configs/vep_config.ini" # Path to VEP config INI file
vep_config_name: "ensembl_vep_115" # Name suffix for output files

# Annotation additional annotation configuration
annotation_annotation_path: "/pasteur/appa/scratch/ghfc/scratch-cache/gnomad/" # Directory containing annotation BCF files
annotation_annotation_list: ["gnomad_v4.1_allChroms.bcf", "LCR.grch38.bed.gz"] # List of BCF files for additional annotation
annotation_gencode: "gencode.v47.basic" # Gencode version for WisecondorX aberrations annotation

# Annotation de novo mutation extraction configuration
annotation_dnm_min_callrate: "0.9" # Minimum call rate for de novo variants (default: 0.9)
annotation_dnm_min_DP: "10" # Minimum depth (DP) for de novo variants in child (default: 10)
annotation_dnm_min_GQ: "19" # Minimum genotype quality (GQ) for de novo variants in child (default: 20)
annotation_dnm_min_VAF: "0.25" # Minimum variant allele frequency (VAF) for de novo variants in child (default: 0.2)

# Wombat configuration
wombat_config_path: "/pasteur/appa/scratch/ghfc/scratch-cache/pywombat" # Directory containing Wombat YAML configuration files
wombat_config_list: ["rare_variants_high_impact.yml", "de_novo_mutations.yml"] # List of Wombat config files (e.g., ["config1.yml", "config2.yml"])

## Ancestry and PGS parameters
# These three have no usable default; the pipeline refuses to start the "ancestry"
# step until all of them are set.
#
# ancestry-pgs reference bundle directory, read in place (the cluster bind mount
# covers it). The core tier is enough; the pgs/ tier is only needed to refit the
# z-score model.
ancestry_reference: "" # TODO: path to the ancestry-pgs reference bundle directory
# PGS weight catalog, SbayesRC layout: Name, Chrom, Position, A1, A2, then one column
# per trait, with A1 the effect allele.
ancestry_catalog: "" # TODO: path to the PGS catalog TSV
# WARNING: this label is baked into every ancestry output file name, and it is the ONLY
# thing that invalidates existing results. The pipeline decides what to recompute by
# looking for files on disk, so changing ancestry_min_dp, ancestry_min_gq or the
# reference bundle WITHOUT bumping this label leaves the old extractions in place and
# scores new families differently from old ones. Encode the bundle version and the
# thresholds in it.
ancestry_panel_name: "" # TODO: e.g. apgs_b1.0.0_dp10gq20
# Thresholds for calling a panel site from the gVCF. DP applies to variant records and
# MIN_DP to reference blocks; a site failing either is emitted as ./. rather than 0/0,
# which is what keeps an uncallable site distinguishable from a genuine homozygous
# reference call.
ancestry_min_dp: 10 # Minimum depth to call a panel site (default: 10)
ancestry_min_gq: 20 # Minimum genotype quality to call a panel site (default: 20)
# Lower - or remove - the 0.90 per-sample coverage floor that admixture enforces.
# Empty keeps the tool's 0.90. A value of 0 disables the gate entirely, so every
# sample is scored however little of the panel it carries.
#
# The bias is real and worth understanding before setting this: the trained model has
# no "missing" state, so an uncalled genotype is read as homozygous reference and a
# low-coverage sample gets plausible-looking but skewed proportions rather than an
# error. Disabling the gate does not hide that - Q.tsv's snp_coverage column is the
# exact per-sample fraction the gate thresholds on, so the missing fraction is
# 1 - snp_coverage, and coverage_threshold in the admixture QC JSON records what the
# gate was set to. Filter or flag on snp_coverage downstream rather than trusting
# every row equally.
ancestry_min_coverage: "" # Empty uses the tool default of 0.90; 0 disables the gate
# Optional: a fitted z-score model directory outside the bundle. Empty uses the
# bundle's own models/<catalog sha256>/.
#
# NOTE: fitting the model is NOT a pipeline step - it writes into the reference bundle
# and needs the bundle's pgs/ tier (~750 MB). Run it once per catalog, before enabling
# this step:
#     ancestry-pgs fit-zscore-model --reference <bundle> --catalog <catalog>
# Every apply step compares the catalog checksum against the model's, so a catalog that
# has changed since the fit is refused rather than adjusted with a stale model.
ancestry_model: "" # Empty uses the model shipped inside the reference bundle

# Extractor configuration
extractor_tsvs_list: [] # List of TSV files with variants to extract (e.g., ["/path/to/variants1.tsv", "/path/to/variants2.tsv"])
liftover_chain: "/pasteur/helix/projects/ghfc_wgs/references/liftover/hg19ToHg38.over.chain.gz" # Chain file for GRCh37 to GRCh38 liftover

# Pseudo-autosomal regions (PAR) coordinates for GRCh38
ref_par1_start: "10001" # PAR1 start position on chrX (GRCh38)
ref_par1_end: "2781479" # PAR1 end position on chrX (GRCh38)
ref_par2_start: "155701383" # PAR2 start position on chrX (GRCh38)
ref_par2_end: "156030895" # PAR2 end position on chrX (GRCh38)

# SLURM account and partition settings
slurm_account: "your_account"
slurm_partition: "ghfc"

# Container cache directory
apptainer_cache: "/pasteur/helix/projects/ghfc_wgs/WGS/test-GRCh38/container-cache/"
singularity_cache: "/pasteur/helix/projects/ghfc_wgs/WGS/test-GRCh38/container-cache/"

# Resource limits
max_memory: "460.GB"
max_cpus: 95
max_time: "240.h"
